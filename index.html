<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriends Day 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #fff8f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart-float { position: absolute; bottom: -60px; opacity: 0; animation: floatUp linear forwards; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .6; }
    90%  { opacity: .4; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1; background: #fff;
    border-radius: 24px; padding: 48px 36px 44px;
    max-width: 480px; width: 92%; text-align: center;
    box-shadow: 0 4px 6px rgba(244,114,182,.1), 0 20px 60px rgba(244,114,182,.22);
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.85) translateY(30px); }
    to   { opacity: 1; transform: none; }
  }
  .badge {
    display: inline-block; background: #fce7f3; color: #9d174d;
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; padding: 6px 16px; border-radius: 99px; margin-bottom: 22px;
  }
  .emoji-big { font-size: 72px; display: block; margin-bottom: 18px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  h1 { font-family: 'Playfair Display', serif; font-size: 26px; font-style: italic; color: #9d174d; line-height: 1.3; margin-bottom: 14px; }
  .sub { font-size: 15px; color: #be618a; line-height: 1.7; margin-bottom: 34px; }
  .btn-yes {
    border: none; border-radius: 50px; font-family: 'Nunito', sans-serif;
    font-size: 16px; font-weight: 700; padding: 14px 36px; cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #fb7185); color: #fff;
    box-shadow: 0 6px 24px rgba(251,113,133,.4); transition: transform .15s;
  }
  .btn-yes:hover { transform: scale(1.06); }
  .btn-no {
    border: none; border-radius: 50px; font-family: 'Nunito', sans-serif;
    font-size: 16px; font-weight: 700; padding: 14px 36px; cursor: pointer;
    background: #fce7f3; color: #9d174d;
    box-shadow: 0 4px 14px rgba(244,114,182,.2);
    position: fixed; z-index: 999; white-space: nowrap;
    transition: left 0.18s ease, top 0.18s ease;
    touch-action: none;
  }
  .whisper { font-size: 12px; color: #d4a0b8; margin-top: 18px; min-height: 18px; letter-spacing: .4px; }
  .success { display: none; }
  .success.show { display: block; animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
  .main-content.hide { display: none; }
  .confetti-burst { font-size: 42px; display: block; margin-bottom: 12px; animation: spin 1s ease both; }
  @keyframes spin { from{transform:rotate(-20deg) scale(.5);opacity:0} to{transform:rotate(0);opacity:1} }
  h2 { font-family: 'Playfair Display', serif; font-size: 30px; font-style: italic; color: #9d174d; margin-bottom: 12px; }
  .divider { width: 60px; height: 2px; background: linear-gradient(to right,transparent,#f472b6,transparent); margin: 20px auto; border: none; }
  .success-msg { font-size: 15px; color: #be618a; line-height: 1.7; }
  .couple { font-size: 40px; display: block; margin-top: 22px; animation: pulse 1.5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<div class="card">
  <div class="main-content" id="mainContent">
    <span class="badge">💝 August 1st · Girlfriends Day</span>
    <span class="emoji-big">🌸</span>
    <h1>Will you be my girlfriend?</h1>
    <p class="sub">Every day with you feels like a holiday.<br>Say yes and make this one unforgettable. 💕</p>
    <button class="btn-yes" onclick="sayYes()">Yes! 💖</button>
    <p class="whisper" id="noWhisper"></p>
  </div>
  <div class="success" id="successScreen">
    <span class="confetti-burst">🎉</span>
    <h2>She said YES! 🥰</h2>
    <hr class="divider">
    <p class="success-msg">Happy Girlfriends Day, my love! 💕<br>I promise to make every day as special<br>as this one. You make my heart so full. 🌹</p>
    <span class="couple">💑</span>
  </div>
</div>

<button class="btn-no" id="noBtn">No 🙅</button>

<script>
  const emojis = ['💕','💗','💓','🌸','✨','💖','💝','🌷','💞'];
  const bg = document.getElementById('bgHearts');
  function spawnHeart() {
    const el = document.createElement('span');
    el.className = 'heart-float';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.fontSize = (14+Math.random()*20)+'px';
    const dur = 5+Math.random()*8;
    el.style.animationDuration = dur+'s';
    bg.appendChild(el);
    setTimeout(()=>el.remove(),(dur+2)*1000);
  }
  for(let i=0;i<18;i++) spawnHeart();
  setInterval(spawnHeart,800);

  const noLines = [
    "Nope! Too slow 🥺","Still no! Try again 👀","Can't catch me! 💔",
    "You know you want to say yes! 🌸","Hehe, running away! 🏃‍♀️💨",
    "Halfway there! Just say yes 😏","You can't escape love! 💕",
    "Wrong button! 😂","Almost gave up… almost! 🤭",
    "Running out of No's! 😬","One more… then YES! 💖","Okay fine… YES IT IS! 🎉",
  ];

  let noCount = 0;
  const noBtn = document.getElementById('noBtn');
  const whisper = document.getElementById('noWhisper');

  noBtn.style.left = (window.innerWidth/2+20)+'px';
  noBtn.style.top  = (window.innerHeight/2+10)+'px';

  function fleeFrom(fx, fy) {
    const rect = noBtn.getBoundingClientRect();
    const bw=rect.width, bh=rect.height;
    const cx=rect.left+bw/2, cy=rect.top+bh/2;
    let dx=cx-fx, dy=cy-fy;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    dx/=d; dy/=d;
    const step=Math.min(window.innerWidth,window.innerHeight)*0.6;
    let nx=cx+dx*step-bw/2, ny=cy+dy*step-bh/2;
    nx=Math.max(10,Math.min(window.innerWidth-bw-10,nx));
    ny=Math.max(10,Math.min(window.innerHeight-bh-10,ny));
    noBtn.style.left=nx+'px';
    noBtn.style.top=ny+'px';
  }

  function handleNo(e) {
    e.preventDefault(); e.stopPropagation();
    const fx = e.touches ? e.touches[0].clientX : e.clientX;
    const fy = e.touches ? e.touches[0].clientY : e.clientY;
    noCount++;
    whisper.textContent = noLines[Math.min(noCount-1, noLines.length-1)];
    if(noCount >= 12){ noBtn.style.display='none'; setTimeout(sayYes,800); return; }
    fleeFrom(fx, fy);
  }

  noBtn.addEventListener('touchstart', handleNo, {passive:false});
  noBtn.addEventListener('click', handleNo);

  function sayYes() {
    document.getElementById('mainContent').classList.add('hide');
    document.getElementById('successScreen').classList.add('show');
    noBtn.style.display='none';
    for(let i=0;i<30;i++) setTimeout(spawnHeart,i*80);
  }
</script>
</body>
</html>
